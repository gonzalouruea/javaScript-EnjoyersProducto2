<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsa de trabajo voluntario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-md bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand ps-2">Bolsa de trabajo voluntario</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="index.html">Dashboard</a>
                    <a class="nav-link" href="voluntariado.html">Voluntariados</a>
                    <a class="nav-link" href="registro.html">Registro</a>
                    <a class="nav-link" href="login.html">Login</a>
                    <a class="nav-link disabled" aria-disabled="true" id="userLogged">User</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Carrusel de imágenes -->
    <div id="carouselDashboard" class="carousel slide ms-5 me-5">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./images/vol01.jpg" class="d-block w-100" alt="Voluntariado juntos">
            </div>
            <div class="carousel-item">
                <img src="./images/vol02.jpg" class="d-block w-100" alt="Cuidado a personas mayores">
            </div>
            <div class="carousel-item">
                <img src="./images/vol03.jpg" class="d-block w-100" alt="Voluntariado">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselDashboard" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselDashboard" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- Contenedor de voluntariados -->
    <div class="container mt-4">
        <div class="row">
            <!-- Voluntariados Disponibles -->
            <div class="col-md-6" id="voluntariadosContainer">
                <h3>Voluntariados Disponibles</h3>
                <div id="rowContainer" class="d-flex flex-wrap"></div>
            </div>
            <!-- Voluntariados Seleccionados -->
            <div class="col-md-6" id="seleccionadosContainer">
                <h3>Voluntariados Seleccionados</h3>
                <div id="dropZone" class="border p-3" style="min-height: 200px; background-color: #f8f9fa;"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="./js/index.js"></script>
    <script type="module" src="./js/almacenaje.js"></script>
    <script type="module" src="./js/int_1_dashboard.js"></script>
</body>

</html>
